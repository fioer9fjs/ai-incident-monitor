name: Validate and run pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate configs and interfaces
        run: python -m scripts.validate_config
      - name: Check source SQL construction
        run: python -m scripts.check_source_sql
      - name: Run pipeline in dry-run mode
        run: python -m scripts.run_pipeline --dry-run
      - name: Commit generated incidents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add incidents/
          git diff --staged --quiet || git commit -m "chore: update incidents (dry-run) [skip ci]"
          git push
