name: Validate and run pipeline

on: [push, pull_request, workflow_dispatch]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate configs and interfaces
        run: python -m scripts.validate_config
      - name: Check source SQL construction
        run: python -m scripts.check_source_sql
      - name: Run pipeline in dry-run mode
        run: python -m scripts.run_pipeline --dry-run
